# LoRA fine-tuning of the reference model on the chat data (D-039). Registered before any run.
# Same as sft-full.yaml except the method and the learning rate. LoRA as in Hu et al. 2021: rank 8 on the
# query and value maps (their best use of a fixed budget, table 5), alpha = rank (their rule: alpha set to
# the first rank tried, not tuned), no adapter dropout (the same as full fine-tuning, which has none).
# Sweep (stage A): lr = 3e-4, 1e-3, 3e-3 with --set, max_steps 400; the main runs (stage B) use the best one.
name: sft-lora
runs_dir: runs
base_checkpoint: runs/ablation-rope-swiglu/best.pt
tokenizer: artifacts/tokenizer/bpe-16k.json

data:
  data_dir: data/processed/sft
  language_weights: {ar: 1.0, en: 1.0}

method:
  kind: lora
  rank: 8
  alpha: 8.0
  targets: [attn.q, attn.v]
  dropout: 0.0

optim:
  lr: 0.001
  min_lr: 0.0001
  warmup_steps: 50
  weight_decay: 0.01
  grad_clip: 1.0

train:
  seed: 1337
  max_steps: 1000
  micro_batch_size: 8
  grad_accum_steps: 4
  eval_interval: 50
  checkpoint_interval: 50
  log_interval: 10
  forgetting_windows: 16
