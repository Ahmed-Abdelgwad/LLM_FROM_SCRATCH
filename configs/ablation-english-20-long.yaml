# Mix ablation at the full length (follow-up to ablation-english-20, D-023 "not decided"): the
# same run as the baseline `local-17m` (5,000 steps, peak learning rate 6e-4 to 6e-5, 200 warmup
# steps, seed 1337) with English (fineweb_edu_10bt) cut from 39.3% of the training tokens to
# 20.0%. The five Arabic sources keep their natural relative weights and get 80% of the tokens
# instead of 60.7%. English weight = a quarter of the Arabic total (101,561,123 / 4).
#
# Fixed before the run. Compared with the baseline, by bits per character on the validation
# split at step 5,000: the mean of the five Arabic sources (arb, ars, ary, arz, wiki_ar). The
# baseline's value is 2.0153. Rule of D-023: better only if that mean falls by at least 0.03,
# and a claim about one source needs at least 0.04. English is reported (baseline 1.563), not
# part of the rule: how much English may degrade is for the project to decide.
# Caveat: the baseline was stopped once at step 2,990 and resumed; this run should not be.
name: ablation-english-20-long
runs_dir: runs

model:
  vocab_size: 16384
  context_length: 512
  d_model: 384
  n_layers: 6
  n_heads: 6
  fast_attention: true

data:
  tokens_dir: data/processed/tokens-16k
  train_sources:
    fineweb_edu_10bt: 25390281
    fw2_arb: 38542549
    fw2_ars: 13431542
    fw2_ary: 5400709
    fw2_arz: 29656698
    wiki_ar: 14529625
  val_sources: [fineweb_edu_10bt, fw2_arb, fw2_ars, fw2_ary, fw2_arz, wiki_ar]

optim:
  lr: 0.0006
  min_lr: 0.00006
  warmup_steps: 200
  weight_decay: 0.1
  grad_clip: 1.0

train:
  seed: 1337
  max_steps: 5000
  micro_batch_size: 8
  grad_accum_steps: 8
  eval_interval: 250
  eval_batches: 20
  checkpoint_interval: 250
  log_interval: 10
