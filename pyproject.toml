[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scratchllm"
version = "0.1.0"
description = "A bilingual (Arabic/English) GPT built from scratch: tokenizer, model, pretraining, LoRA/SFT, evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "tokenizers>=0.19",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "typer>=0.12",
    "pyarrow>=15",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]
tracking = ["trackio"]

[project.scripts]
scratchllm = "scratchllm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scratchllm"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: slower tests (deselect with -m 'not slow')"]
